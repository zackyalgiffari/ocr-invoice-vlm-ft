[project]
name = "invoice-vlm"
version = "0.1.0"
description = "Fine-tune a small VLM (Qwen3.5) to extract invoice/receipt fields as JSON"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pillow", "pyyaml"]

[project.optional-dependencies]
# What the Colab VM needs on top of its preinstalled torch/torchvision (see requirements-colab.txt).
train = ["transformers>=5.23,<6", "peft>=0.21", "accelerate>=1.15", "datasets>=5.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
